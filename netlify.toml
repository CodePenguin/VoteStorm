[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[dev]
  autoLaunch = false
  framework = "#custom"
  command = "npm run dev:app"
  targetPort = 5173

# Single-page app: any other path that is not a real file serves the Vue app.
# Function URLs under /.netlify/functions/ are handled before redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep secret keys that appear in page addresses from leaking through Referer headers, and tighten browser defaults.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
