[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'no build step'"

[[redirects]]
  from = "/admin/*"
  to = "/presenter/:splat"
  status = 301

[[redirects]]
  from = "/presenter/*"
  to = "/presenter/index.html"
  status = 200

[[redirects]]
  from = "/vote/*"
  to = "/vote/index.html"
  status = 200

[[redirects]]
  from = "/results/*"
  to = "/results/index.html"
  status = 200
