[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[dev]
  autoLaunch = false
  framework = "#custom"
  command = "npm run dev:app"
  targetPort = 5173

[[redirects]]
  from = "/admin/*"
  to = "/presenter/:splat"
  status = 301

# Single-page app: any other path that is not a real file serves the Vue app.
# Function URLs under /.netlify/functions/ are handled before redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
