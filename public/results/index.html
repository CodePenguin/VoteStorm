<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LivePoll Results</title>
<link rel="stylesheet" href="/shared/styles.css" />
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/shared/api.js"></script>
<style>
  .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 48px 32px; }
  .prompt { font-size: clamp(1.8rem, 4.5vw, 4rem); font-weight: 800; margin-bottom: 44px; }
  .bars { display: grid; gap: 18px; }
  .bar-row { display: grid; grid-template-columns: minmax(120px, 340px) 1fr 190px; align-items: center; gap: 24px; font-size: clamp(1.1rem, 2.2vw, 2rem); }
  .bar-label { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
  .bar-track { height: clamp(32px, 3.4vw, 56px); background: var(--surface); border: 1px solid var(--border); }
  .bar-fill { background: color-mix(in srgb, var(--accent) 55%, var(--surface-2)); }
  .bar-row.leader .bar-fill { background: var(--accent); }
  .bar-row.leader .bar-label { color: var(--accent); }
  .bar-count { font-variant-numeric: tabular-nums; font-weight: 700; }
  .bar-count small { color: var(--text-muted); font-weight: 500; font-size: .75em; margin-left: 6px; }
  .average { margin-top: 36px; display: flex; align-items: baseline; gap: 14px; }
  .average strong { font-size: clamp(2.5rem, 6vw, 4.5rem); line-height: 1; color: var(--accent); }
  .average span { font-size: 1.3rem; color: var(--text-muted); }
  .not-active { text-align: center; color: var(--text-muted); font-weight: 700; font-size: clamp(1.6rem, 4vw, 3rem); padding: 64px 0; }
  .hidden-results { text-align: center; padding: 48px 0; color: var(--text-muted); }
  .hidden-results .big-count { font-size: clamp(5rem, 16vw, 12rem); font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; margin-bottom: 12px; }
  .hidden-results p { font-size: clamp(1.3rem, 2.6vw, 2.2rem); }
  .bar-row.correct .bar-fill { background: var(--success); }
  .bar-row.correct .bar-label { color: var(--success); }
  .donut-wrap { display: flex; align-items: center; justify-content: center; gap: clamp(24px, 5vw, 72px); flex-wrap: wrap; }
  .donut { position: relative; width: clamp(220px, 34vh, 420px); aspect-ratio: 1; flex: none; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut circle { fill: none; stroke-width: 6.5; }
  .donut-ring { stroke: var(--surface-2); }
  .donut-seg { transition: stroke-dasharray .6s ease, stroke-dashoffset .6s ease; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-center strong { font-size: clamp(2.5rem, 6vw, 5rem); line-height: 1; }
  .donut-center span { color: var(--text-muted); font-size: 1.1rem; }
  .donut-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; font-size: clamp(1.1rem, 2vw, 1.8rem); min-width: 260px; }
  .donut-legend li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
  .donut-legend .swatch { width: 18px; height: 18px; border-radius: 5px; }
  .donut-legend .num small { color: var(--text-muted); margin-left: 8px; font-size: .75em; }
  .donut-legend li.correct { color: var(--success); font-weight: 700; }
  .waiting { text-align: center; }
  .waiting .icon { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 24px; background: var(--accent-soft); color: var(--accent); }
  .waiting .icon svg { width: 36px; height: 36px; }
  .waiting h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 8px; }
  .waiting .join-title { margin-top: 22px; }
  .waiting .qr { margin: 0 auto; }
  .waiting .url { margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: clamp(1rem, 1.6vw, 1.5rem); color: var(--text-muted); overflow-wrap: anywhere; }
  .waiting .badge { font-size: clamp(.95rem, 1.4vw, 1.25rem); padding: 6px 16px; margin-top: 22px; }
  .waiting p { color: var(--text-muted); font-size: 1.2rem; }
  .connect-screen { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
  .footer { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 18px 40px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 1rem; }
  .footer-info { display: flex; gap: 24px; align-items: center; }
  .qr { width: clamp(200px, 22vh, 340px); flex: none; background: #fff; padding: 8px; border-radius: 10px; border: 1px solid var(--border); }
  .qr svg { display: block; width: 100%; height: auto; }
  .footer strong { color: var(--text); font-size: 1.15rem; }
  @media (max-width: 720px) {
    .topbar, .footer { padding: 14px 16px; }
    .qr { width: 180px; }
    main { padding: 0 16px 16px; }
    .bar-row { grid-template-columns: 1fr 90px; gap: 6px 12px; }
    .bar-label { grid-column: 1 / -1; text-align: left; }
    .bar-track { height: 32px; }
  }
</style>
</head>
<body x-data="resultsApp()" x-init="init()">
<div class="page">
  <div class="topbar">
    <span class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      </span>
      LivePoll
    </span>
    <span class="badge" :class="connected ? 'active' : 'lobby'" x-show="!roomClosed">
      <span class="dot" :class="connected && 'pulse'"></span>
      <span x-text="connected ? 'Live' : 'Connecting…'"></span>
    </span>
  </div>

  <main>
    <template x-if="loadError">
      <div class="alert error" x-text="loadError"></div>
    </template>

    <template x-if="roomCode && roomClosed && slides">
      <section class="carousel large" aria-roledescription="carousel" aria-label="Results"
               @keydown.arrow-left.window="goTo(slide - 1)" @keydown.arrow-right.window="goTo(slide + 1)">
        <template x-if="slides.length === 0">
          <div class="card state"><h2>No questions to show</h2></div>
        </template>
        <template x-if="slides.length > 0">
          <div>
            <div class="carousel-track" x-ref="track" @scroll.passive="onScroll()">
              <template x-for="(q, qi) in slides" :key="q.id">
                <article class="carousel-slide">
                  <div class="card slide-card">
                    <div class="slide-eyebrow" x-text="'Question ' + (qi + 1)"></div>
                    <h2 class="slide-title" x-text="q.prompt"></h2>

                    <template x-if="q.type === 'choice' && q.display === 'donut'">
                      <div class="donut-wrap">
                        <div class="donut" role="img" aria-label="Donut chart of responses">
                          <svg viewBox="0 0 42 42">
                            <circle class="donut-ring" cx="21" cy="21" r="15.915"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 0" :stroke="donutColor(0)"
                                      :stroke-dasharray="slideSeg(q, 0).dash + ' ' + (100 - slideSeg(q, 0).dash)" :stroke-dashoffset="slideSeg(q, 0).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 1" :stroke="donutColor(1)"
                                      :stroke-dasharray="slideSeg(q, 1).dash + ' ' + (100 - slideSeg(q, 1).dash)" :stroke-dashoffset="slideSeg(q, 1).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 2" :stroke="donutColor(2)"
                                      :stroke-dasharray="slideSeg(q, 2).dash + ' ' + (100 - slideSeg(q, 2).dash)" :stroke-dashoffset="slideSeg(q, 2).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 3" :stroke="donutColor(3)"
                                      :stroke-dasharray="slideSeg(q, 3).dash + ' ' + (100 - slideSeg(q, 3).dash)" :stroke-dashoffset="slideSeg(q, 3).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 4" :stroke="donutColor(4)"
                                      :stroke-dasharray="slideSeg(q, 4).dash + ' ' + (100 - slideSeg(q, 4).dash)" :stroke-dashoffset="slideSeg(q, 4).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 5" :stroke="donutColor(5)"
                                      :stroke-dasharray="slideSeg(q, 5).dash + ' ' + (100 - slideSeg(q, 5).dash)" :stroke-dashoffset="slideSeg(q, 5).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 6" :stroke="donutColor(6)"
                                      :stroke-dasharray="slideSeg(q, 6).dash + ' ' + (100 - slideSeg(q, 6).dash)" :stroke-dashoffset="slideSeg(q, 6).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 7" :stroke="donutColor(7)"
                                      :stroke-dasharray="slideSeg(q, 7).dash + ' ' + (100 - slideSeg(q, 7).dash)" :stroke-dashoffset="slideSeg(q, 7).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 8" :stroke="donutColor(8)"
                                      :stroke-dasharray="slideSeg(q, 8).dash + ' ' + (100 - slideSeg(q, 8).dash)" :stroke-dashoffset="slideSeg(q, 8).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 9" :stroke="donutColor(9)"
                                      :stroke-dasharray="slideSeg(q, 9).dash + ' ' + (100 - slideSeg(q, 9).dash)" :stroke-dashoffset="slideSeg(q, 9).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 10" :stroke="donutColor(10)"
                                      :stroke-dasharray="slideSeg(q, 10).dash + ' ' + (100 - slideSeg(q, 10).dash)" :stroke-dashoffset="slideSeg(q, 10).offset"></circle>
                              <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="q.options.length > 11" :stroke="donutColor(11)"
                                      :stroke-dasharray="slideSeg(q, 11).dash + ' ' + (100 - slideSeg(q, 11).dash)" :stroke-dashoffset="slideSeg(q, 11).offset"></circle>
                          </svg>
                          <div class="donut-center"><strong x-text="q.tally.totalVotes || 0"></strong><span x-text="(q.tally.totalVotes || 0) === 1 ? 'response' : 'responses'"></span></div>
                        </div>
                        <ul class="donut-legend">
                          <template x-for="(opt, i) in q.options" :key="i">
                            <li :class="{ correct: (q.correct || []).includes(i) }">
                              <span class="swatch" :style="`background:${donutColor(i)}`"></span>
                              <span x-text="opt + ((q.correct || []).includes(i) ? ' \u2713' : '')"></span>
                              <span class="num"><span x-text="slideCount(q, i)"></span><small x-text="slidePct(q, i) + '%'"></small></span>
                            </li>
                          </template>
                        </ul>
                      </div>
                    </template>

                    <template x-if="q.type === 'choice' && q.display !== 'donut'">
                      <div>
                        <template x-for="(opt, i) in q.options" :key="i">
                          <div class="sbar" :class="{ leader: slideLeader(q, i), correct: (q.correct || []).includes(i) }">
                            <div class="sbar-head">
                              <span class="label" x-text="opt"></span>
                              <span class="count"><span x-text="slideCount(q, i)"></span><small x-text="slidePct(q, i) + '%'"></small></span>
                            </div>
                            <div class="sbar-track"><div class="sbar-fill" :style="`width: ${slidePct(q, i)}%`"></div></div>
                          </div>
                        </template>
                      </div>
                    </template>

                    <template x-if="q.type === 'rating'">
                      <div>
                        <template x-for="v in slideValues(q)" :key="v">
                          <div class="sbar" :class="{ leader: slideLeader(q, v) }">
                            <div class="sbar-head">
                              <span class="label" x-text="v"></span>
                              <span class="count" x-text="slideCount(q, v)"></span>
                            </div>
                            <div class="sbar-track"><div class="sbar-fill" :style="`width: ${slidePct(q, v)}%`"></div></div>
                          </div>
                        </template>
                        <div class="slide-average">
                          <strong x-text="fmtAvg(q.tally.average)"></strong>
                          <span class="muted">average rating</span>
                        </div>
                      </div>
                    </template>

                    <p class="slide-total" x-text="(q.tally.totalVotes || 0) + ((q.tally.totalVotes || 0) === 1 ? ' response' : ' responses')"></p>
                  </div>
                </article>
              </template>
            </div>
          </div>
        </template>
      </section>
    </template>

    <template x-if="lockedId && lockedReady && !currentQuestion && !loadError">
      <div class="not-active" role="status">This question isn&rsquo;t active right now</div>
    </template>

    <template x-if="currentQuestion && !roomClosed">
      <div>
        <h1 class="prompt" x-text="currentQuestion.prompt"></h1>

        <template x-if="currentQuestion.resultsHidden">
          <div class="hidden-results">
            <div class="big-count" x-text="tally.totalVotes || 0"></div>
            <p x-text="(tally.totalVotes || 0) === 1 ? 'response received' : 'responses received'"></p>
          </div>
        </template>

        <template x-if="currentQuestion.type === 'choice' && !currentQuestion.resultsHidden && currentQuestion.display === 'donut'">
          <div class="donut-wrap">
            <div class="donut" role="img" aria-label="Donut chart of responses">
              <svg viewBox="0 0 42 42">
                <circle class="donut-ring" cx="21" cy="21" r="15.915"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 0" :stroke="donutColor(0)"
                        :stroke-dasharray="donutSeg(0).dash + ' ' + (100 - donutSeg(0).dash)" :stroke-dashoffset="donutSeg(0).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 1" :stroke="donutColor(1)"
                        :stroke-dasharray="donutSeg(1).dash + ' ' + (100 - donutSeg(1).dash)" :stroke-dashoffset="donutSeg(1).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 2" :stroke="donutColor(2)"
                        :stroke-dasharray="donutSeg(2).dash + ' ' + (100 - donutSeg(2).dash)" :stroke-dashoffset="donutSeg(2).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 3" :stroke="donutColor(3)"
                        :stroke-dasharray="donutSeg(3).dash + ' ' + (100 - donutSeg(3).dash)" :stroke-dashoffset="donutSeg(3).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 4" :stroke="donutColor(4)"
                        :stroke-dasharray="donutSeg(4).dash + ' ' + (100 - donutSeg(4).dash)" :stroke-dashoffset="donutSeg(4).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 5" :stroke="donutColor(5)"
                        :stroke-dasharray="donutSeg(5).dash + ' ' + (100 - donutSeg(5).dash)" :stroke-dashoffset="donutSeg(5).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 6" :stroke="donutColor(6)"
                        :stroke-dasharray="donutSeg(6).dash + ' ' + (100 - donutSeg(6).dash)" :stroke-dashoffset="donutSeg(6).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 7" :stroke="donutColor(7)"
                        :stroke-dasharray="donutSeg(7).dash + ' ' + (100 - donutSeg(7).dash)" :stroke-dashoffset="donutSeg(7).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 8" :stroke="donutColor(8)"
                        :stroke-dasharray="donutSeg(8).dash + ' ' + (100 - donutSeg(8).dash)" :stroke-dashoffset="donutSeg(8).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 9" :stroke="donutColor(9)"
                        :stroke-dasharray="donutSeg(9).dash + ' ' + (100 - donutSeg(9).dash)" :stroke-dashoffset="donutSeg(9).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 10" :stroke="donutColor(10)"
                        :stroke-dasharray="donutSeg(10).dash + ' ' + (100 - donutSeg(10).dash)" :stroke-dashoffset="donutSeg(10).offset"></circle>
                <circle class="donut-seg" cx="21" cy="21" r="15.915" x-show="currentQuestion.options.length > 11" :stroke="donutColor(11)"
                        :stroke-dasharray="donutSeg(11).dash + ' ' + (100 - donutSeg(11).dash)" :stroke-dashoffset="donutSeg(11).offset"></circle>
              </svg>
              <div class="donut-center"><strong x-text="tally.totalVotes || 0"></strong><span x-text="(tally.totalVotes || 0) === 1 ? 'response' : 'responses'"></span></div>
            </div>
            <ul class="donut-legend">
              <template x-for="(opt, i) in currentQuestion.options" :key="i">
                <li :class="{ correct: (currentQuestion.correct || []).includes(i) }">
                  <span class="swatch" :style="`background:${donutColor(i)}`"></span>
                  <span class="lbl" x-text="opt + ((currentQuestion.correct || []).includes(i) ? ' \u2713' : '')"></span>
                  <span class="num"><span x-text="tally.counts[i] || 0"></span><small x-text="pct(i) + '%'"></small></span>
                </li>
              </template>
            </ul>
          </div>
        </template>

        <template x-if="currentQuestion.type === 'choice' && !currentQuestion.resultsHidden && currentQuestion.display !== 'donut'">
          <div class="bars">
            <template x-for="(opt, i) in currentQuestion.options" :key="i">
              <div class="bar-row" :class="{ leader: isLeader(i), correct: (currentQuestion.correct || []).includes(i) }">
                <div class="bar-label" x-text="opt + ((currentQuestion.correct || []).includes(i) ? ' ✓' : '')"></div>
                <div class="bar-track"><div class="bar-fill" :style="`width: ${pct(i)}%`"></div></div>
                <div class="bar-count"><span x-text="tally.counts[i] || 0"></span><small x-text="pct(i) + '%'"></small></div>
              </div>
            </template>
          </div>
        </template>

        <template x-if="currentQuestion.type === 'rating' && !currentQuestion.resultsHidden">
          <div>
            <div class="bars">
              <template x-for="n in (currentQuestion.scaleMax - currentQuestion.scaleMin + 1)" :key="n">
                <div class="bar-row" :class="{ leader: isLeader(currentQuestion.scaleMin + n - 1) }">
                  <div class="bar-label" x-text="currentQuestion.scaleMin + n - 1"></div>
                  <div class="bar-track"><div class="bar-fill" :style="`width: ${pct(currentQuestion.scaleMin + n - 1)}%`"></div></div>
                  <div class="bar-count"><span x-text="tally.counts[currentQuestion.scaleMin + n - 1] || 0"></span></div>
                </div>
              </template>
            </div>
            <div class="average">
              <strong x-text="fmtAvg(tally.average)"></strong>
              <span>average rating</span>
            </div>
          </div>
        </template>
      </div>
    </template>
  </main>


  <div class="connect-screen" x-show="showConnect && !loadError" x-cloak>
    <div class="waiting">
      <div class="qr" role="img" aria-label="QR code linking to the voting page" x-html="qrSvg"></div>
      <h1 class="join-title">Scan to vote</h1>
      <p class="url" x-text="voteUrlLabel"></p>
      <span class="badge accent">
        <span class="dot" :class="connectedCount > 0 && 'pulse'"></span>
        <span x-text="connectedCount + (connectedCount === 1 ? ' person' : ' people') + ' connected'"></span>
      </span>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-info">
      <span x-show="!roomClosed && !(currentQuestion && currentQuestion.resultsHidden) && !(lockedId && !currentQuestion)"><strong x-text="tally.totalVotes || 0"></strong> <span x-text="(tally.totalVotes || 0) === 1 ? 'response' : 'responses'"></span></span>
      <span x-show="roomClosed" x-cloak>Swipe or use the arrow keys to browse questions</span>
      <span x-show="roomCode" x-text="'Room ' + roomCode"></span>
    </div>
  </footer>
</div>

<script>
function resultsApp() {
  return {
    ...LivePoll.carouselMixin(),
    roomCode: null,
    currentQuestion: null,
    tally: { counts: [], totalVotes: 0 },
    connected: false,
    loadError: null,
    roomClosed: false,
    qrSvg: '',
    voteUrlLabel: '',
    connectedCount: 0,
    showConnect: false,
    lockedId: null,
    lockedReady: false,
    resultsId: null,

    async init() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      this.resultsId = parts.length > 1 ? parts[1] : null;
      if (!this.resultsId) {
        this.loadError = 'No room specified.';
        return;
      }
      try {
        const resolved = await LivePoll.api(`resolve-results-key?key=${encodeURIComponent(this.resultsId)}`);
        this.roomCode = resolved.roomCode;
      } catch (err) {
        this.loadError = err.status === 404 ? 'Results not found.' : ((err && err.message) || 'Something went wrong');
        return;
      }
      this.buildQr();
      const qParam = new URLSearchParams(window.location.search).get('q');
      this.lockedId = qParam && /^\d+$/.test(qParam) ? Number(qParam) : null;

      try {
        if (this.lockedId) {
          await this.activateLocked();
          await this.loadLocked();
        } else {
        const state = await LivePoll.api(`get-room-state?roomCode=${encodeURIComponent(this.roomCode)}`);
        this.currentQuestion = state.currentQuestion;
        this.setTally(state.tally);
        this.roomClosed = state.status === 'closed';
        this.showConnect = !!state.showConnect;
        if (this.roomClosed) await this.loadClosedResults();
        }
      } catch (err) {
        this.loadError = (err && err.message) || 'Something went wrong';
        return;
      }

      const ably = await LivePoll.subscribeRoom(this.roomCode, {
        state: (data) => {
          if (this.lockedId) {
            this.loadLocked().catch((err) => { this.loadError = (err && err.message) || 'Something went wrong'; });
            return;
          }
          this.currentQuestion = data.currentQuestion;
          this.setTally(data.initialTally);
          this.roomClosed = data.status === 'closed';
          this.showConnect = !!data.showConnect;
          if (this.roomClosed) this.loadClosedResults().catch((err) => { this.loadError = (err && err.message) || 'Something went wrong'; });
        },
        tally: (data) => {
          if (this.currentQuestion && data.questionId === this.currentQuestion.id) {
            this.setTally(data);
          }
        },
      }, { onPresence: (count) => { this.connectedCount = count; } });
      this.connected = ably.connection.state === 'connected';
      ably.connection.on((change) => { this.connected = change.current === 'connected'; });
    },

    async activateLocked() {
      try {
        await LivePoll.api('results-activate', {
          method: 'POST',
          body: JSON.stringify({ resultsKey: this.resultsId, questionId: this.lockedId }),
        });
      } catch (err) {
        // viewing still works if activation fails
      }
    },

    async loadLocked() {
      const data = await LivePoll.api(`get-question-results?roomCode=${encodeURIComponent(this.roomCode)}&questionId=${this.lockedId}`);
      this.currentQuestion = data.question;
      this.lockedReady = true;
      this.setTally(data.tally);
      this.roomClosed = false;
      this.showConnect = false;
    },

    buildQr() {
      try {
        const url = `${window.location.origin}/vote/${encodeURIComponent(this.roomCode)}`;
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        this.qrSvg = qr.createSvgTag({ scalable: true, margin: 0 });
        this.voteUrlLabel = url.replace(/^https?:\/\//, '');
      } catch (err) {
        this.qrSvg = '';
      }
    },

    donutSeg(i) {
      const opts = this.currentQuestion.options;
      if (i >= opts.length) return { dash: 0, offset: 0 };
      const counts = opts.map((_, n) => this.tally.counts[n] || 0);
      const sum = counts.reduce((x, y) => x + y, 0);
      let acc = 0;
      for (let n = 0; n < i; n++) acc += sum ? (counts[n] / sum) * 100 : 0;
      return { dash: sum ? (counts[i] / sum) * 100 : 0, offset: -acc };
    },

    setTally(t) {
      this.tally = t && t.counts ? t : { counts: [], totalVotes: (t && t.totalVotes) || 0 };
    },

    pct(value) {
      const total = this.tally.totalVotes || 0;
      if (!total) return 0;
      return Math.round(((this.tally.counts[value] || 0) / total) * 100);
    },

    isLeader(value) {
      const count = this.tally.counts[value] || 0;
      if (!count) return false;
      const all = Array.isArray(this.tally.counts) ? this.tally.counts : Object.values(this.tally.counts);
      return count === Math.max(...all.map((c) => c || 0));
    },

  };
}
</script>
